name: Deploy SynCloud Connect to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the standalone landing page
        run: |
          mkdir -p _pages
          cp public/proposal.html _pages/index.html
          mkdir -p _pages/delete-account _pages/privacy
          cp delete-account/index.html _pages/delete-account/index.html
          cp privacy/index.html _pages/privacy/index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
